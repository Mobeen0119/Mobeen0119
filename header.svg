<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="900" height="180" fill="#0a0e1a"/>

  <!-- Blurred background shapes -->
  <g filter="url(#blur)" opacity="0.4">
    <circle cx="150" cy="90" r="80" fill="#FFB000" opacity="0.3"/>
    <circle cx="750" cy="90" r="80" fill="#FF6B00" opacity="0.3"/>
    <circle cx="450" cy="90" r="100" fill="#1a3a6a" opacity="0.4"/>
    <rect x="0" y="100" width="900" height="80" fill="#FFB000" opacity="0.1"/>
  </g>

  <!-- Clean solid background for text -->
  <rect x="180" y="50" width="540" height="80" rx="20" fill="#0d1326" opacity="0.85"/>
  <rect x="180" y="50" width="540" height="80" rx="20" fill="none" stroke="#FFB000" stroke-width="1.5" opacity="0.3"/>

  <!-- Name -->
  <text x="450" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    Mobeen Ahmed
  </text>

  <!-- Subtle glow behind text -->
  <text x="450" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#FFB000" text-anchor="middle" letter-spacing="2" opacity="0.08">
    Mobeen Ahmed
  </text>
</svg>
